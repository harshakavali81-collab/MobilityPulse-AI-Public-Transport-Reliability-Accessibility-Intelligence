# OPTIONAL blueprint; not deployed until a cloud-hosting account authorizes it.
services:
  - type: web
    name: mobilitypulse-api
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        sync: false
      - key: MOBILITYPULSE_API_KEY
        sync: false
      - key: MOBILITYPULSE_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: MOBILITYPULSE_MAX_POST_BYTES
        value: "8192"
