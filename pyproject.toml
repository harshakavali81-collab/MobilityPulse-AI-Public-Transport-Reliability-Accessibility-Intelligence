[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "mobilitypulse-ai"
version = "1.1.0"
description = "Public transport reliability and accessibility portfolio platform"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
