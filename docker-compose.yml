services:
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    ports: ["127.0.0.1:8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    restart: unless-stopped
  frontend:
    build: {context: ./frontend}
    depends_on: [backend]
    ports: ["127.0.0.1:8080:80"]
    restart: unless-stopped
