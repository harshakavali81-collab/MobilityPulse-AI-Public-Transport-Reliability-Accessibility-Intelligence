name: Publish MobilityPulse Portfolio and Offline Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobilitypulse-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline demo dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Export strictly synthetic read-only API snapshots
        env:
          PYTHONPATH: .:src
        run: python scripts/export_static_api.py
      - name: Build the static React dashboard
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE_PATH: /MobilityPulse-AI-Public-Transport-Reliability-Accessibility-Intelligence/demo/
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Prepare portfolio and offline demo
        run: |
          mkdir -p site/portfolio site/assets site/demo
          cp portfolio/index.html site/portfolio/index.html
          cp assets/*.svg site/assets/
          cp -r frontend/dist/. site/demo/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=portfolio/"><title>MobilityPulse AI</title><a href="portfolio/">Open MobilityPulse AI portfolio</a></html>' > site/index.html
          touch site/.nojekyll
      - name: Validate offline site bundle
        run: |
          test -f site/index.html
          test -f site/portfolio/index.html
          test -f site/demo/index.html
          test -f site/demo/sample-api/overview.json
          test -f site/demo/sample-api/feed/predictions.json
          test "$(find site/assets -maxdepth 1 -name '*.svg' | wc -l)" -eq 10
          python -c "import json; d=json.load(open('site/demo/sample-api/overview.json')); assert d['metadata']['data_mode']=='synthetic'; assert not d['metadata']['live_tracking']"
      - name: Upload a ready-to-host ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilitypulse-portfolio-and-offline-demo
          path: site/
          retention-days: 30
  pages_status:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Detect whether repository Pages has been activated
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/pages-response.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = 200 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages exists: deployment will be attempted."
          elif [ "$code" = 404 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not yet enabled. The static website is available as a build artifact. Enable Pages in Settings -> Pages -> Source -> GitHub Actions."
          else
            cat /tmp/pages-response.json
            echo "::error::GitHub Pages status request returned HTTP $code"
            exit 1
          fi
  deploy:
    needs: [build,pages_status]
    if: needs.pages_status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated site bundle
        uses: actions/download-artifact@v4
        with:
          name: mobilitypulse-portfolio-and-offline-demo
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
